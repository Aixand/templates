name: Template checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Template validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test templates and runnable example
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test the copied documentation checker
        run: python3 files/tests/tooling/checks/docs_test.py
      - name: Validate selected documentation
        run: python3 files/scripts/checks/check-docs.py --root .
      - name: Test repository policy
        run: python3 tests/tooling/checks/repository_files_test.py
